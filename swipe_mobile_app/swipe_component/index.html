<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuppSwipe card</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  /* A frame that cannot fill the room above the page's bottom bar (a landscape phone, a page this frame cannot read) keeps a blank
     strip under the buttons: the page has no bottom padding of its own on the card screen, and this strip is what lets it scroll the
     Keep / Replace row clear of the bar. */
  #wrap.spacer { padding-bottom: 76px; }
  #stage {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: pan-y;
  }
  .rail {
    position: absolute;
    top: 16px;
    z-index: 3;
    font-weight: 900;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border-radius: 12px;
    border: 3px solid;
    opacity: 0;
    transition: opacity .12s ease;
    pointer-events: none;
  }
  .rail.keep  { left: 16px;  color: #b91c1c; border-color: #ef4444; transform: rotate(-12deg); }
  .rail.repl  { right: 16px; color: #047857; border-color: #10b981; transform: rotate(12deg); }
  .tcard {
    position: absolute;
    inset: 0 0 6px 0; /* room for the shadow */
    z-index: 2;
    border-radius: 20px;
    padding: 14px 14px 12px 14px;
    box-sizing: border-box;
    background: var(--card-bg, linear-gradient(160deg, #ffffff 0%, #f8fbff 55%, #f4f7fb 100%));
    border: 1px solid rgba(15, 23, 42, 0.06);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
    cursor: grab;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    will-change: transform;
    outline: none;
    overflow-y: auto;
    scroll-padding-bottom: 44px; /* a focused control (the athlete-guide button) is scrolled clear of the fade and the pill at the foot */
  }
  .tcard:focus-visible { box-shadow: 0 0 0 3px #2563eb inset; }
  .tcard:active { cursor: grabbing; }
  /* A card taller than its frame scrolls inside it; its rows must keep their size (the 4 px progress bar used to be squashed to 0). */
  .tcard > * { flex-shrink: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .count { font-size: .8rem; font-weight: 800; color: #475569; letter-spacing: .02em; }
  .prev { font-size: .72rem; font-weight: 700; color: #334155; background: rgba(15,23,42,0.06); border-radius: 999px; padding: 2px 8px; }
  .bar { height: 4px; border-radius: 999px; background: rgba(15,23,42,0.08); margin-top: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent, #64748b); }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
  .badge {
    flex: 0 0 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; background: #ffffff; box-shadow: 0 2px 8px rgba(15,23,42,0.08);
  }
  .name { overflow-wrap: anywhere; font-size: 1.6rem; font-weight: 900; line-height: 1.05; color: var(--ink, #0f172a); letter-spacing: -0.02em; }
  .dose { margin-top: 4px; color: #334155; font-size: .9rem; font-weight: 600; }
  .dose b { color: #0f172a; }
  .foodwrap {
    margin-top: 12px; padding: 12px; border-radius: 16px;
    background: rgba(255,255,255,0.82); border: 1px solid rgba(15,23,42,0.06);
  }
  .foodlbl { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #047857; }
  .foodrow { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .ficon { flex: 0 0 auto; font-size: 1.7rem; line-height: 1; }
  .food { font-size: 1.05rem; font-weight: 800; color: #0f172a; line-height: 1.2; }
  .food.nofood { font-size: .9rem; font-weight: 700; line-height: 1.4; color: #334155; }
  /* The full USDA name of the food: only when the card has room for it (the Swap food window always has it). */
  .src { margin-top: 6px; font-size: .72rem; line-height: 1.3; color: #475569; overflow-wrap: anywhere; }
  #wrap.nosrc .src { display: none; }
  .portion { margin-top: 10px; padding: 8px 10px; border-radius: 12px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #14532d; font-size: .84rem; line-height: 1.5; }
  .portion .pl { display: block; }
  .portion button.pl { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 4px 0; margin: 0; cursor: pointer; min-height: 32px; }
  .portion button.pl .pl-text { flex: 1 1 auto; min-width: 0; }
  .portion button.pl:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; border-radius: 8px; }
  .portion button.pl .chev { flex: 0 0 auto; font-weight: 800; color: #047857; }
  .portion b { color: #0f172a; }
  .warn { margin-top: 10px; padding: 7px 10px; border-radius: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; font-size: .82rem; font-weight: 600; line-height: 1.4; }
  .bio { margin-top: 8px; padding: 7px 10px; border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f; font-size: .82rem; line-height: 1.4; }
  .hint { text-align: center; margin-top: auto; padding-top: 10px; font-size: .8rem; color: #475569; }  /* pinned to the foot of the card */
  /* Swap food / Ask AI / More: the tools of the card, one row above Keep / Replace (a tap opens a sheet of the page; it never
     changes the card or a decision). Content-sized buttons on one line; a very large text wraps the row instead of cutting a label. */
  #extras { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 4px 0 4px; flex: 0 0 auto; }
  #extras button {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 44px;
    padding: 0 6px;
    white-space: nowrap;
    border-radius: 12px;
    font: inherit;
    font-size: .8rem;
    font-weight: 800;
    color: #1e293b;
    background: #fff;
    border: 1.5px solid #94a3b8;
    cursor: pointer;
  }
  #extras button[hidden] { display: none; }
  #extras button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  #extras button:not([aria-disabled="true"]):active { transform: scale(0.97); background: #f1f5f9; }
  #extras button[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  #actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 4px 8px 4px; flex: 0 0 auto; }
  /* Equal shares of the row; a label is never broken inside a word: a button that cannot hold its longest word wraps onto its own
     row (a large text size on a narrow phone), and from about 140 % text the decorative arrows go (the label says it). */
  #actions button {
    flex: 1 1 0;
    min-width: min-content;
    overflow-wrap: break-word;
    min-height: 46px;
    border-radius: 12px;
    font: inherit;
    font-size: .95rem;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid;
    background: #fff;
  }
  #actions button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  #actions #btnBack { flex: 0 0 52px; min-width: 52px; border-color: #e2e8f0; color: #334155; }
  #wrap.big .arr { display: none; }
  #actions #btnKeep { border-color: #fca5a5; color: #b91c1c; }
  #actions #btnRepl { border-color: #047857; color: #ffffff; background: #047857; }
  #actions button:not(:disabled):active { transform: scale(0.97); }
  #actions button:disabled, #actions button[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  /* Tight card: fitHeight() switches it on when the room above the page's fixed bottom bar is short (small phones, large text),
     so the Keep / Replace row stays clear of the bar. Same texts, same font sizes for the body copy; only the spacing, the
     badge and the name shrink, and on a touch screen the swipe hint is dropped after the first card the visit has drawn (a mouse
     and keyboard user keeps it: it is the only place the arrow keys are named). */
  #wrap.tight .tcard { padding: 8px 12px 6px 12px; }
  #wrap.tight .head { margin-top: 6px; gap: 10px; }
  #wrap.tight .badge { flex-basis: 40px; height: 40px; font-size: 1.3rem; border-radius: 12px; }
  #wrap.tight .name { font-size: 1.4rem; }
  #wrap.tight .dose { margin-top: 2px; }
  #wrap.tight .foodwrap { margin-top: 6px; padding: 6px 10px; }
  #wrap.tight .foodrow { margin-top: 4px; }
  #wrap.tight .src { margin-top: 3px; }
  #wrap.tight .portion { margin-top: 6px; padding: 4px 8px; }
  #wrap.tight .warn { margin-top: 6px; padding: 5px 8px; }
  #wrap.tight .bio { margin-top: 6px; padding: 5px 8px; }
  #wrap.tight .hint { padding-top: 6px; }
  #wrap.tight #extras { padding-top: 2px; }
  #wrap.tight:not(.first):not(.fine) .hint:not(.hint-keep) { display: none; }
  #wrap.tight #actions { padding: 4px 4px 6px 4px; }
  /* A card taller than its frame scrolls inside it: a fade (and, when a lot is hidden, a small pill) says there is more. */
  #stage.cue::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 30px; z-index: 4; pointer-events: none;
                      border-radius: 0 0 20px 20px; background: linear-gradient(to bottom, rgba(248,251,255,0), rgba(248,251,255,.96) 85%); }
  #cue { display: none; position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; pointer-events: none; white-space: nowrap;
         font-size: .72rem; font-weight: 800; color: #334155; background: #fff; border: 1px solid rgba(15,23,42,.12); border-radius: 999px; padding: 1px 9px; }
  #stage.cue-strong #cue { display: block; }
  @media (prefers-reduced-motion: reduce) {
    .tcard, .rail { transition: none !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="rail keep" id="railKeep" aria-hidden="true">KEEP</div>
    <div class="rail repl" id="railRepl" aria-hidden="true">REPLACE</div>
    <div class="tcard" id="card" tabindex="0" role="group" aria-roledescription="swipe card"></div>
    <div id="cue" aria-hidden="true">&#9662; scroll for more</div>
  </div>
  <div id="extras">
    <button type="button" id="btnSwap" aria-label="Swap food: choose another whole food" hidden>Swap food</button>
    <button type="button" id="btnAsk" aria-label="Ask AI about this nutrient" hidden>Ask AI</button>
    <button type="button" id="btnMore" aria-label="More options: report a problem with this card">More</button>
  </div>
  <div id="actions">
    <button type="button" id="btnBack" aria-label="Back to the previous card" title="Back">&#8617;</button>
    <button type="button" id="btnKeep" aria-label="Keep pill"><span class="arr" aria-hidden="true">&#9664; </span>Keep pill</button>
    <button type="button" id="btnRepl" aria-label="Replace">Replace<span class="arr" aria-hidden="true"> &#9654;</span></button>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
(function () {
  var stage = document.getElementById("stage");
  var card = document.getElementById("card");
  var railKeep = document.getElementById("railKeep");
  var railRepl = document.getElementById("railRepl");
  var btnBack = document.getElementById("btnBack");
  var btnKeep = document.getElementById("btnKeep");
  var btnRepl = document.getElementById("btnRepl");
  var btnSwap = document.getElementById("btnSwap");
  var btnAsk = document.getElementById("btnAsk");
  var btnMore = document.getElementById("btnMore");
  var extras = document.getElementById("extras");
  var actions = document.getElementById("actions");
  var live = document.getElementById("live");
  var lastFocusId = "";      // the action button the user used last: focus goes back to it when the next card is drawn
  var announce = "";         // "Kept the pill." - said together with the next card
  var HEIGHT = 420;   // minimum frame height (from Python)
  var lastHeight = 0;
  var tight = false;  // the compact card (see "#wrap.tight"); once on it stays on for the scan
  var showSrc = true; // the full USDA name in the food block: only while the card has room for it (see fitHeight)
  var spacer = false; // the blank strip under the buttons (see "#wrap.spacer")
  var big = false;    // a large text size (the root font size is 140 % or more): see "#wrap.big"
  var drawnBefore = false;  // a card was drawn in this page load already (a resumed scan opens on a later card: its hint is still new)
  var firstCard = true;     // the card on screen is the first of the scan or the first this page load drew: it keeps the swipe hint
  var wrap = document.getElementById("wrap");
  var lastArgsKey = "";
  var maxHeight = 0;  // the tallest card of this scan so far: the frame only grows, so the buttons stay where the thumb is
  var committed = false;
  var canReplace = true;
  var canBack = false;
  // The iframe is reused for every card of a scan (stable Streamlit key), so
  // each swipe carries the card it was made on and a unique id; Python applies
  // it once and answers with the next card's props in the same script run.
  var cardId = "";
  var cardIndex = 0;
  var scanId = "";   // the scan these cards belong to (from Python); echoed in every event so the page can tell an old card's tap from a new one's
  var seq = 0;
  var animEnd = 0;      // fly-out animation end; new props wait for it
  var pendingArgs = null;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Mouse / trackpad users get the arrow-key hint; touch screens don't need it.
  var finePointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;

  function send(type, extra) {
    var msg = { isStreamlitMessage: true, type: type };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    window.parent.postMessage(msg, "*");
  }
  function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

  var ROW_GAP = 6;          // air between the Keep / Replace row and the bar
  var ROW_PAD = 8;          // #actions' bottom padding on a normal card (6 px on a tight one, so the row ends ~4 px above the bar there)
  var BAR_FALLBACK = 66;    // the bar's height + offset when it cannot be measured (e.g. hidden while a field has focus)
  var TIGHT_BELOW = 660;    // below this much room (px) a new scan starts tight
  var ROOM_FLOOR = 320;     // never a frame shorter than this (landscape phones scroll the page as before)
  var FILL_MAX = 900;       // the tallest frame that fills the room (the tallest phones are ~930 px high; a desktop window gets a card, not a column)
  var SPACER = 76;          // the blank strip under the buttons of a frame that cannot fill the room (the bar's footprint and a little air)
  var MIN_WINDOW = 240;     // the least height the card itself is given to read in (the stage); see fitHeight
  var growMax = 0;          // the frame height a scan needed when the room was too small for MIN_WINDOW (one height for the whole scan)
  var footprint = 0;        // from the bar's top edge to the bottom of the window (px), as hostRoom() saw it; a bigger bar (large text) needs a longer strip
  var spacerPx = SPACER;    // the strip this frame has now
  // The tallest frame that still leaves the Keep / Replace row above the page's fixed bottom bar (page scrolled to the top).
  // The host page is the same origin as this frame; Infinity (= nothing changes) when it cannot be read.
  function hostRoom() {
    try {
      var pw = window.parent, pd = pw.document;
      var main = pd.querySelector('[data-testid="stMain"]');
      var bar = pd.querySelector('[class~="st-key-appbar"]');
      var br = bar ? bar.getBoundingClientRect() : null;
      var barTop = (br && br.height > 0) ? br.top : pw.innerHeight - BAR_FALLBACK;
      var frameTop = window.frameElement.getBoundingClientRect().top + (main ? main.scrollTop : 0);
      var room = Math.floor(barTop - frameTop + ROW_PAD - ROW_GAP);
      footprint = Math.max(0, Math.ceil(pw.innerHeight - barTop));
      return room > 0 ? room : Infinity;
    } catch (e) { return Infinity; }
  }
  // The one place the wrapper's classes are written.
  function paint() {
    wrap.className = (tight ? "tight" : "") + (firstCard ? " first" : "") + (finePointer ? " fine" : "") +
      (showSrc ? "" : " nosrc") + (spacer ? " spacer" : "") + (big ? " big" : "");
    wrap.style.paddingBottom = (spacer && spacerPx > SPACER) ? spacerPx + "px" : "";   // the class gives the usual strip
  }
  function setTight(on) {
    tight = on;
    paint();
  }
  function measureContent() {
    var probe = card.cloneNode(true);
    probe.removeAttribute("id");
    probe.style.cssText = "position:absolute;visibility:hidden;left:0;top:0;right:auto;bottom:auto;" +
      "height:auto;overflow:visible;width:" + card.clientWidth + "px;";
    stage.appendChild(probe);
    var contentHeight = probe.scrollHeight;
    stage.removeChild(probe);
    return contentHeight;
  }
  // A card taller than its frame scrolls inside it; the fade at its foot says so, and a small pill ("scroll for more") as soon as
  // text itself is cut, not only a lot of it. What is hidden is counted without the card's bottom padding: a card that is only
  // short of its padding shows all its text and gets no fade (the fade would wash out the last line for nothing).
  var CUE_FADE = 2;   // px of text cut off: the fade at the card's foot
  var CUE_PILL = 8;   // px of text cut off (about half a line): the "scroll for more" pill
  function updateCue() {
    var pad = parseFloat(window.getComputedStyle(card).paddingBottom) || 0;
    var cut = card.scrollHeight - card.clientHeight - card.scrollTop - pad;
    stage.classList.toggle("cue", cut > CUE_FADE);
    stage.classList.toggle("cue-strong", cut > CUE_PILL);
  }
  card.addEventListener("scroll", updateCue, { passive: true });
  // Size the frame. Where the page can be read the frame FILLS the room between its top and the page's fixed bottom bar (at most
  // FILL_MAX px), on every card, so the card, its tools and the Keep / Replace row are one fixed screen and the page itself does not
  // scroll; the card keeps its own scroll for what does not fit (fade + pill). The density (normal / tight) is the smallest that
  // fits the card, and once tight it stays tight for the scan. Where the room cannot be measured the frame is sized to the card's
  // content as it always was (never below the minimum Python asked for), plus the blank strip that lets the page scroll the row
  // clear of the bar.
  var lastRoom = null;   // the room the frame was last fitted to (see the poll below)
  function fitHeight() {
    big = (parseFloat(window.getComputedStyle(document.documentElement).fontSize) || 16) >= 22;
    var room = hostRoom();
    lastRoom = room;
    var measured = isFinite(room);
    var avail = measured ? Math.min(Math.max(room, ROOM_FLOOR), FILL_MAX) : Infinity;   // the frame height asked for
    var contentHeight, actionsHeight;
    showSrc = false;   // the density is chosen on the card without the optional source line
    for (var on = tight ? 1 : 0; on <= 1; on++) {
      setTight(on === 1);
      actionsHeight = extras.offsetHeight + actions.offsetHeight + 6;
      contentHeight = measureContent();
      if (Math.max(HEIGHT, Math.min(780, contentHeight + actionsHeight + 10)) <= avail) { break; }  // fits: no need to tighten
    }
    var h = Math.max(HEIGHT, Math.min(780, contentHeight + actionsHeight + 10), maxHeight);
    maxHeight = h;
    // A frame that fills a room too small for the card to be read in (a large text size on a small phone: the tools and the
    // Keep / Replace row take the room, and the card is left a slit) is made as tall as MIN_WINDOW needs instead, and the page
    // scrolls, as it does for a landscape phone: the card scrolls inside its window, the page scrolls the buttons into reach.
    var grow = measured && avail - actionsHeight < MIN_WINDOW;
    if (grow) {
      avail = Math.max(actionsHeight + MIN_WINDOW, growMax);
      growMax = avail;
    }
    spacer = grow || !(measured && room >= ROOM_FLOOR);
    if (measured) {
      h = avail;   // a frame that fills the room
    }
    spacerPx = spacer ? Math.max(SPACER, footprint + ROW_GAP + 4) : SPACER;   // enough for the page to scroll the row clear of the bar
    if (spacer) { h += spacerPx; }
    // The source line stays when the card still fits its frame with it.
    showSrc = true;
    paint();
    var stageRoom = h - (spacer ? spacerPx : 0) - extras.offsetHeight - actions.offsetHeight - 6;
    if (measured && measureContent() > stageRoom) { showSrc = false; paint(); }
    if (Math.abs(h - lastHeight) > 2) { lastHeight = h; setHeight(h); }
    setTimeout(updateCue, 80);
  }
  // The room itself changed (a turned phone, a window, the toolbars, a filter chip above the card): the density is chosen again from
  // that room, so a room that came back is not left with the cramped card it had while it was short. (Card after card, within one
  // room, the density only ever tightens: every card of the scan has one look.)
  function refit() {
    tight = hostRoom() < TIGHT_BELOW;
    maxHeight = 0;
    growMax = 0;
    fitHeight();
  }
  var lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth !== lastW) { lastW = window.innerWidth; tight = hostRoom() < TIGHT_BELOW; }  // a turned phone starts over
    if (!committed) { fitHeight(); }
  });
  // The page's own size changes (a desktop window, a phone's toolbars coming and going) move the bar: measure again (best effort).
  var hostTimer = 0;
  try {
    window.parent.addEventListener("resize", function () {
      clearTimeout(hostTimer);
      hostTimer = setTimeout(function () { if (!committed) { refit(); } }, 120);
    });
  } catch (e) {}
  // The room also changes without any message to this frame: a filter chip appears above the card when the Diet sheet closes, a
  // caption comes or goes, the bar hides for a text field. Streamlit sends no new props for an unchanged card, so the room is looked at
  // again a few times a second (two rectangles; nothing is redrawn unless it changed).
  setInterval(function () {
    if (committed || document.hidden || lastRoom === null) { return; }
    var room = hostRoom();
    if (room !== lastRoom) { refit(); }
  }, 250);
  function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(args) {
    args = args || {};
    // Streamlit re-sends the very same props whenever the frame height changes: that must not redraw the card (it would also
    // swallow the "Kept the pill." announcement, which the second draw replaces).
    var argsKey = JSON.stringify(args);
    if (!committed && argsKey === lastArgsKey) { fitHeight(); return; }
    lastArgsKey = argsKey;
    committed = false;
    canReplace = (args.canReplace !== false);
    cardId = String(args.cardId || "");
    scanId = args.scan == null ? "" : String(args.scan);
    cardIndex = parseInt(args.index || 0, 10) || 0;
    var firstDraw = !drawnBefore;   // the first card this frame draws (a new scan, a resumed one, a card opened from the results)
    firstCard = cardIndex === 0 || !drawnBefore;
    drawnBefore = true;
    // Opened from the results ("edit mode"): Back returns to the results.
    var editing = !!args.editing;
    canBack = editing || cardIndex > 0;
    btnBack.setAttribute("aria-label", editing ? "Back to your results" : "Back to the previous card");
    btnBack.title = editing ? "Back to results" : "Back";
    HEIGHT = parseInt(args.height || 420, 10) || 420;
    if (cardIndex === 0 && !editing) { maxHeight = 0; growMax = 0; tight = hostRoom() < TIGHT_BELOW; }  // a new scan (or back at the first card) starts from its own size
    else if (firstDraw) { tight = hostRoom() < TIGHT_BELOW; }  // a resumed scan or a card opened from the results: the density a new scan has on this phone
    setTight(tight);
    card.style.setProperty("--accent", args.accent || "#64748b");
    card.style.setProperty("--ink", args.ink || "#0f172a");
    if (args.bg) { card.style.setProperty("--card-bg", args.bg); }

    var idx = parseInt(args.index || 0, 10) + 1;
    var total = parseInt(args.total || 1, 10);
    // No food: the card says why (the diet filter left nothing, no food in the data, ...) instead of pointing at a list that is not there.
    var foodTxt = args.food ? esc(args.food) : esc(args.foodNote || "No whole-food match for this one.");
    var srcHtml = (args.food && args.source) ? '<div class="src">' + esc(args.source) + '</div>' : '';
    btnSwap.hidden = !args.canSwap;
    btnAsk.hidden = !args.canAsk;
    var portionRows = "";
    // "eat" only before an actual amount ("~85 g"), not before verdicts such as
    // "not practical from food alone (~2.3 kg/day)" or "a lot of food (...)".
    function portion(txt) {
      var t = String(txt || "");
      return (/^[~<\d]/.test(t) ? "eat " : "") + "<b>" + esc(t) + "</b>";
    }
    if (args.matchDose) {
      portionRows += '<span class="pl">💊 Match this dose &rarr; ' + portion(args.matchDose) + '</span>';
    }
    if (args.rdaAmount) {
      // A button: a tap opens the Athlete RDA guide at this nutrient (see "guide" in the app). The visible text is its name.
      portionRows += '<button type="button" class="pl pl-guide" data-guide="1"><span class="pl-text">🏃 Target for very active people' +
        (args.rdaLabel ? ' (' + esc(args.rdaLabel) + ')' : '') +
        ' &rarr; ' + portion(args.rdaAmount) + '<span class="sr-only">. Opens the athlete guide.</span></span><span class="chev" aria-hidden="true">&rsaquo;</span></button>';
    }
    var portionHtml = portionRows ? '<div class="portion">' + portionRows + '</div>' : '';
    var warnHtml = args.warn ? '<div class="warn" role="note">' + esc(args.warn) + '</div>' : '';
    var bioHtml = args.bioNote ? '<div class="bio" role="note">💡 ' + esc(args.bioNote) + '</div>' : '';
    var prevHtml = args.previous ? '<span class="prev">Your choice: ' + esc(args.previous) + '</span>' : '';
    var pct = Math.max(4, Math.min(100, Math.round(100 * idx / Math.max(total, 1))));
    var foodIcon = args.foodIcon ? '<span class="ficon" aria-hidden="true">' + esc(args.foodIcon) + '</span>' : '';
    card.innerHTML =
      '<div class="row"><span class="count">Card ' + idx + ' of ' + total + '</span>' + prevHtml + '</div>' +
      '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      '<div class="head"><span class="badge" aria-hidden="true">💊</span><div>' +
      '<div class="name">' + esc(args.name || "Micronutrient") + '</div>' +
      '<div class="dose">In your pill: <b>' + esc(args.dose || "n/a") + '</b></div></div></div>' +
      warnHtml +
      '<div class="foodwrap"><div class="foodlbl">Eat instead</div>' +
      '<div class="foodrow">' + foodIcon + '<div class="food' + (args.food ? '' : ' nofood') + '">' + foodTxt + '</div></div>' + srcHtml + portionHtml + '</div>' +
      bioHtml +
      '<div class="hint' + ((!canReplace || editing) ? ' hint-keep' : '') + '">' + (canReplace
        ? 'Swipe <b>◀ keep the pill</b> · <b>eat the food ▶</b>' + (finePointer ? ' (or ← →)' : '')
        : 'No whole-food match for this one — keep the pill or go back') +
        (editing ? '<br>Editing from your results — your choice takes you straight back.' : '') + '</div>';
    card.setAttribute("aria-label",
      "Card " + idx + " of " + total + ": " + (args.name || "Micronutrient") + ", dose " + (args.dose || "not available") +
      (args.food ? ". Whole-food replacement: " + args.food : (args.foodNote ? ". " + args.foodNote : "")) +
      (args.matchDose ? ". To match the dose: " + args.matchDose : "") +
      (args.warn ? ". Warning: " + args.warn : "") +
      (args.bioNote ? ". Notes: " + args.bioNote : ""));

    btnRepl.disabled = !canReplace;
    btnBack.disabled = !canBack;
    btnKeep.disabled = false;
    btnKeep.removeAttribute("aria-disabled"); btnRepl.removeAttribute("aria-disabled"); btnBack.removeAttribute("aria-disabled");
    btnSwap.removeAttribute("aria-disabled"); btnAsk.removeAttribute("aria-disabled"); btnMore.removeAttribute("aria-disabled");
    // Say what was done and which card is next (cleared first, so identical texts are announced again).
    var said = announce + "Card " + idx + " of " + total + ": " + (args.name || "Micronutrient") + ", " + (args.dose || "dose not available") + ".";
    announce = "";
    live.textContent = "";
    setTimeout(function () { live.textContent = said; }, 60);
    if (lastFocusId) {
      var again = document.getElementById(lastFocusId);
      if (again && !again.disabled) { again.focus({ preventScroll: true }); }
    }
    card.style.transition = "none";
    card.style.transform = "";
    railKeep.style.opacity = 0;
    railRepl.style.opacity = 0;
    if (!lastHeight) {
      fitHeight();   // the first draw of a frame asks for its final height at once (no short frame that then grows)
      if (!lastHeight) { lastHeight = HEIGHT; setHeight(HEIGHT); }
    }
    requestAnimationFrame(fitHeight);
    card.scrollTop = 0;
  }

  function rails(dx) {
    var t = Math.min(1, Math.abs(dx) / 90);
    railRepl.style.opacity = (dx > 8 && canReplace) ? t : 0;
    railKeep.style.opacity = dx < -8 ? t : 0;
  }

  // The page is analysing a new label: the card of the scan before stays on screen, dimmed, until the new one replaces it, and
  // nothing on it is live meanwhile (a tap would also restart the run). Same origin as the page; false when it cannot be read.
  function hostBusy() {
    try { return !!window.parent.document.querySelector(".analyze-loading-wrap"); } catch (e) { return false; }
  }
  // Every event carries the card, its index and the scan it was made on.
  function stamp(value) {
    value.card = cardId;
    value.index = cardIndex;
    if (scanId !== "") { value.scan = scanId; }
    return value;
  }

  function commit(dir) {
    if (committed || hostBusy()) return;
    if (dir === "right" && !canReplace) return;
    if (dir === "back" && !canBack) return;
    committed = true;
    var active = document.activeElement;
    lastFocusId = (active && active.parentNode && active.parentNode.id === "actions") ? active.id : "";
    // aria-disabled (not disabled): a disabled button drops keyboard focus, and the page loses its place after every swipe.
    btnKeep.setAttribute("aria-disabled", "true"); btnRepl.setAttribute("aria-disabled", "true"); btnBack.setAttribute("aria-disabled", "true");
    btnSwap.setAttribute("aria-disabled", "true"); btnAsk.setAttribute("aria-disabled", "true"); btnMore.setAttribute("aria-disabled", "true");
    announce = dir === "right" ? "Replaced with the whole food. " : (dir === "left" ? "Kept the pill. " : "Going back. ");
    seq += 1;
    var value = stamp({ dir: dir, id: Date.now() + "-" + seq });
    if (dir === "back" || reduceMotion) {
      setValue(value);
      return;
    }
    var w = Math.max(window.innerWidth, 480);
    var off = dir === "right" ? w : -w;
    card.style.transition = "transform .3s ease";
    card.style.transform = "translate(" + off + "px, -30px) rotate(" + (dir === "right" ? 22 : -22) + "deg)";
    (dir === "right" ? railRepl : railKeep).style.opacity = 1;
    // Send right away: the server round trip overlaps the fly-out, and the next
    // card's props are held until the animation is done (see onRender).
    animEnd = Date.now() + 220;
    setValue(value);
  }

  function onRender(args) {
    var wait = animEnd - Date.now();
    if (wait <= 0) { pendingArgs = null; render(args); return; }
    var first = pendingArgs === null;
    pendingArgs = args;
    if (first) {
      setTimeout(function () { var a = pendingArgs; pendingArgs = null; render(a); }, wait);
    }
  }

  // Drag-to-swipe. Pointer Events cover mouse, pen and touch; the legacy touch
  // listeners are only used on browsers without Pointer Events, so a single
  // touch never triggers both paths.
  var dragging = false, sx = 0, sy = 0, dx = 0, dy = 0, horizontal = null, movedBeyondTap = false;
  var THRESH = 80;

  function down(x, y) {
    if (committed || hostBusy()) return;
    movedBeyondTap = false;
    dragging = true; horizontal = null;
    sx = x; sy = y; dx = 0; dy = 0;
    card.style.transition = "none";
  }
  function move(x, y, ev) {
    if (!dragging) return;
    dx = x - sx; dy = y - sy;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) { movedBeyondTap = true; }
    if (horizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      horizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!horizontal) return; // vertical gesture: let the card content scroll
    card.style.transform = "translate(" + dx + "px," + (dy * 0.22) + "px) rotate(" + (dx / 18) + "deg)";
    rails(dx);
    if (ev && ev.cancelable) ev.preventDefault();
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    if (horizontal && dx > THRESH && canReplace) {
      commit("right");
    } else if (horizontal && dx < -THRESH) {
      commit("left");
    } else {
      card.style.transition = reduceMotion ? "none" : "transform .2s ease";
      card.style.transform = "";
      rails(0);
    }
  }

  if (window.PointerEvent) {
    var downOnGuide = false;
    card.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      downOnGuide = !!(e.target.closest && e.target.closest("[data-guide]"));
      down(e.clientX, e.clientY);
      // On the guide link the capture waits until the finger really moves (see move()), so a tap still reaches the button.
      if (!downOnGuide) { try { card.setPointerCapture(e.pointerId); } catch (err) {} }
    });
    card.addEventListener("pointermove", function (e) {
      if (downOnGuide && dragging && !card.hasPointerCapture(e.pointerId) && (Math.abs(e.clientX - sx) > 6 || Math.abs(e.clientY - sy) > 6)) {
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
      }
      move(e.clientX, e.clientY, e);
    });
    card.addEventListener("pointerup", up);
    card.addEventListener("pointercancel", up);
  } else {
    card.addEventListener("touchstart", function (e) { var t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchmove", function (e) { var t = e.touches[0]; move(t.clientX, t.clientY, e); }, { passive: false });
    card.addEventListener("touchend", up);
    card.addEventListener("mousedown", function (e) { down(e.clientX, e.clientY); });
    window.addEventListener("mousemove", function (e) { move(e.clientX, e.clientY, e); });
    window.addEventListener("mouseup", up);
  }

  function guideEvent() {
    if (committed || hostBusy()) return;   // a swipe is already on its way / an analysis is running
    seq += 1;
    setValue(stamp({ kind: "guide", id: "g" + Date.now() + "-" + seq, nutrient: cardId }));
  }
  // The tools (Swap food / Ask AI / More): each posts one event that the page answers with a sheet. They never change the card or a
  // decision. A second tap within 0.7 s (a double tap) is dropped, and nothing is sent while a swipe is on its way.
  var toolUntil = 0;
  var returnTo = null;   // the tool that opened a sheet: when the page hands the focus back to this frame it goes to that button again
  function toolEvent(kind) {
    if (committed || hostBusy()) return;
    var now = Date.now();
    if (now < toolUntil) return;
    toolUntil = now + 700;
    seq += 1;
    returnTo = kind === "swap" ? btnSwap : (kind === "ask" ? btnAsk : btnMore);
    setValue(stamp({ kind: kind, id: kind + "-" + now + "-" + seq }));
  }
  // A sheet over the page makes the page behind it inert, so the button that had the focus loses it; the page returns the focus to this
  // frame when the sheet closes, and the keyboard or screen-reader user is put back on the button they used.
  window.addEventListener("focus", function () {
    if (!returnTo || (document.activeElement && document.activeElement !== document.body)) { return; }
    var button = returnTo;
    returnTo = null;
    if (!button.hidden) { try { button.focus({ preventScroll: true }); } catch (e) {} }
  });
  // The frame is announced by its title: the component's own name ("app.tinder_swipe") says nothing.
  try { window.frameElement.setAttribute("title", "Nutrient card: swipe, or use the buttons"); } catch (e) {}
  btnSwap.addEventListener("click", function () { toolEvent("swap"); });
  btnAsk.addEventListener("click", function () { toolEvent("ask"); });
  btnMore.addEventListener("click", function () { toolEvent("report"); });
  card.addEventListener("click", function (e) {
    if (!(e.target.closest && e.target.closest("[data-guide]"))) { return; }
    if (e.detail > 0 && movedBeyondTap) { movedBeyondTap = false; return; }   // a pointer click after a drag was a swipe, not a tap (keyboard clicks have detail 0)
    guideEvent();
  });
  btnKeep.addEventListener("click", function () { commit("left"); });
  btnRepl.addEventListener("click", function () { commit("right"); });
  btnBack.addEventListener("click", function () { commit("back"); });
  // aria-disabled buttons are still clickable: the opacity says "not now", commit() ignores a second tap.
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { commit("left"); e.preventDefault(); }
    else if (e.key === "ArrowRight") { commit("right"); e.preventDefault(); }
    else if (e.key === "Backspace") { commit("back"); e.preventDefault(); }
  });

  window.addEventListener("message", function (event) {
    var d = event.data;
    if (event.source !== window.parent) return; // only our Streamlit host
    if (!d || d.type !== "streamlit:render") return;
    onRender(d.args);
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight(HEIGHT);
})();
</script>
</body>
</html>
