<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuppSwipe card</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  /* A frame that cannot fill the room above the page's bottom bar (a landscape phone, a page this frame cannot read) keeps a blank
     strip under the card: the page has no bottom padding of its own on the card screen, and this strip is what lets it scroll the
     card's footer (Back / Keep / Replace) clear of the bar. */
  #wrap.spacer { padding-bottom: 76px; }
  #stage {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: pan-y;
  }
  .rail {
    position: absolute;
    top: 16px;
    z-index: 3;
    font-weight: 900;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border-radius: 12px;
    border: 3px solid;
    opacity: 0;
    transition: opacity .12s ease;
    pointer-events: none;
  }
  .rail.keep  { left: 16px;  color: #b91c1c; border-color: #ef4444; transform: rotate(-12deg); }
  .rail.repl  { right: 16px; color: #047857; border-color: #10b981; transform: rotate(12deg); }
  /* The card is ONE rounded, shadowed box and everything the visitor taps lives inside it: a scrolling body (.cbody: the header with the
     Ask AI chip, the food with the Swap food chip, the notes) above a pinned footer (#actions: Back / Keep pill / Replace). Nothing of
     this frame sits below the box; the page's fixed bottom bar is the only thing under it. */
  .tcard {
    position: absolute;
    inset: 0 0 6px 0; /* room for the shadow */
    z-index: 2;
    border-radius: 20px;
    box-sizing: border-box;
    background: var(--card-bg, linear-gradient(160deg, #ffffff 0%, #f8fbff 55%, #f4f7fb 100%));
    border: 1px solid rgba(15, 23, 42, 0.06);
    box-shadow: 0 4px 7px -4px rgba(15, 23, 42, 0.18); /* a contact shadow that fits the 6 px strip: a wide one is cut off by the frame's edges */
    cursor: grab;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    will-change: transform;
    outline: none;
    overflow: hidden; /* the rounded box clips both the body and the footer; the body is what scrolls (.cbody) */
  }
  .tcard:focus-visible { outline: 3px solid #2563eb; outline-offset: -3px; }
  .tcard:active { cursor: grabbing; }
  /* The window the text is read in: it sits above the footer, so the fade and the pill (children of .cmain) end where the footer begins. */
  .cmain { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .cbody {
    flex: 1 1 auto;
    min-height: 0;
    box-sizing: border-box;
    padding: 14px 14px 12px 14px;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: pan-y;
    scroll-padding-bottom: 44px; /* a focused control (the athlete-guide button, a chip) is scrolled clear of the fade and the pill at the foot */
  }
  /* A card taller than its frame scrolls inside it; its rows must keep their size (the 4 px progress bar used to be squashed to 0). */
  .cbody > * { flex-shrink: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .count { font-size: .8rem; font-weight: 800; color: #475569; letter-spacing: .02em; }
  .prev { font-size: .72rem; font-weight: 700; color: #334155; background: rgba(15,23,42,0.06); border-radius: 999px; padding: 2px 8px; }
  .bar { height: 4px; border-radius: 999px; background: rgba(15,23,42,0.08); margin-top: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent, #64748b); }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px; }
  .badge {
    flex: 0 0 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; background: #ffffff; box-shadow: 0 2px 8px rgba(15,23,42,0.08);
  }
  .name { overflow-wrap: anywhere; font-size: 1.6rem; font-weight: 900; line-height: 1.05; color: var(--ink, #0f172a); letter-spacing: -0.02em; }
  .dose { margin-top: 4px; color: #334155; font-size: .9rem; font-weight: 600; }
  .dose b { color: #0f172a; }
  .foodwrap {
    margin-top: 12px; padding: 12px; border-radius: 16px;
    background: rgba(255,255,255,0.82); border: 1px solid rgba(15,23,42,0.06);
  }
  .foodhead .chip { margin-top: -2px; }   /* the chip leans a little into the box's top padding, never into the food below */
  .foodlbl { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #047857; }
  .foodrow { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .ficon { flex: 0 0 auto; font-size: 1.7rem; line-height: 1; }
  .food { font-size: 1.05rem; font-weight: 800; color: #0f172a; line-height: 1.2; }
  .food.nofood { font-size: .9rem; font-weight: 700; line-height: 1.4; color: #334155; }
  /* The full USDA name of the food: only when the card has room for it (the Swap food window always has it). */
  .src { margin-top: 6px; font-size: .72rem; line-height: 1.3; color: #475569; overflow-wrap: anywhere; }
  #wrap.nosrc .src { display: none; }
  /* The two amounts of the "Eat instead" box are TWO panels, not two lines of one box: "Match your pill" (green: the food amount that equals the
     pill's own dose) and "Athlete target" (slate: the amount very active people aim for; a button that opens the athlete guide). Each has a
     heading in the style of the "Eat instead" label, the food amount as the big figure at the end of that row (so the two figures are read side
     by side) and one plain sentence that says what the amount is a match for. A verdict ("not practical from food alone (...)") or a note
     ("(~0.6 Brazil nuts)") wraps under the sentence at the panel's full width; a panel with nothing to say is not drawn at all. The colours are
     one family per panel (--p-*); the slate is none of the colours the card's other things use (the warning's orange, the note's blue, the
     chips' indigo and teal, the footer's red and green), and both tints are opaque, so the text on them has the same contrast on every card
     colour. Where a panel is too narrow for the hint's word ("Why?", below 17.25 em: a phone narrower than about 356 px, or a large text size)
     only the chevron stays: the query is in em, so a larger text size narrows the panel for it as a smaller phone does. */
  .portion { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; container-type: inline-size; }
  .pl {
    --p-bg: #ecfdf5; --p-line: #a7f3d0; --p-bar: #10b981; --p-head: #047857; --p-ink: #14532d; --p-eat: #166534; --p-fig: #0f172a;
    display: block; box-sizing: border-box; width: 100%; margin: 0; padding: 6px 10px 6px 9px; text-align: left; font: inherit; line-height: 1.35;
    color: var(--p-ink); background: var(--p-bg); border: 1px solid var(--p-line); border-left: 4px solid var(--p-bar); border-radius: 12px;
  }
  .pl-guide { --p-bg: #d9e0ea; --p-line: #8796ab; --p-bar: #475569; --p-head: #334155; --p-ink: #1e293b; --p-eat: #334155; min-height: 44px; cursor: pointer; }
  .pl-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 8px; }
  .pl-head { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: 1.25; color: var(--p-head); }
  /* position: relative with a z-index paints the figure above the rows after it (and above the chevron, which is clipped below). In
     forced-colors mode (Windows high contrast) the browser puts a backplate behind every glyph, and the next row's backplate used to be
     painted over the tail of the figure's "g" (it read as "q"). */
  .pl-amt { position: relative; z-index: 1; margin-left: auto; white-space: nowrap; font-size: .8rem; font-weight: 700; color: var(--p-eat); }
  .pl-amt b { font-size: 1.2rem; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; color: var(--p-fig); }
  .pl-row { display: flex; flex-wrap: wrap; align-items: center; column-gap: 6px; }
  .pl-line { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .pl-sent { flex: 1 1 auto; min-width: 0; font-size: .84rem; }
  .pl-note { display: block; font-size: .78rem; line-height: 1.3; }
  .pl-near { flex: 0 0 auto; margin-left: auto; text-align: right; }   /* a short bracket shares the sentence's row, under the figure, when it fits, else it has a row of its own */
  .pl-verdict { display: block; margin-top: 1px; font-size: .82rem; font-weight: 800; color: var(--p-fig); overflow-wrap: anywhere; }
  .pl-more { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px; color: var(--p-head); }
  .pl-why { font-size: .8rem; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .pl-more .chev { font-size: 1.4rem; font-weight: 800; line-height: .8; }
  .pl-guide:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  @container (max-width: 17.25em) { .pl-why { display: none; } }   /* 276 px at 100 % text: a 360 px phone (the panel is 280 px) keeps the word */
  /* Forced colors also paint a backplate behind the whole content area of the chevron, which is taller than its line (line-height .8). Where
     the panel's padding is small (the tight density, 3 px) the backplate reached the panel's bottom border and cut a gap in it, right under
     the chevron. Clipped to the chevron's own row (not at its sides) it cannot. */
  @media (forced-colors: active) { .pl-more { clip-path: inset(0 -4px); } }
  .warn { margin-top: 10px; padding: 7px 10px; border-radius: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; font-size: .82rem; font-weight: 600; line-height: 1.4; }
  .bio { margin-top: 8px; padding: 7px 10px; border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f; font-size: .82rem; line-height: 1.4; }
  .hint { text-align: center; margin-top: auto; padding-top: 10px; font-size: .8rem; color: #475569; }  /* pinned to the foot of the card */
  /* Ask AI (header) and Swap food (the "Eat instead" box): two chips inside the card, each beside the thing it acts on. A tap opens a sheet
     of the page; it never changes the card or a decision. They must read as buttons, so each is a raised, tinted pill with a small icon
     before its bold label: Ask AI in indigo with a sparkle, Swap food in teal with two arrows. Two families, so they are told apart from
     each other and from the footer (Keep: red outline, Replace: filled green). Text on the tint is 6.7-8.9:1, the 1.5 px border is 4.7:1 or
     more against every card colour. The chip is 34 px high to look; its tap area is 46 px (the ::after), which adds nothing to the layout.
     They exist only when the card offers them (no AI / one food only: no chip, no gap), and are one line each. */
  .chip {
    --c-ink: #3730a3; --c-top: #eef2ff; --c-bot: #e0e7ff; --c-line: #4f46e5; --c-press: #c7d2fe; --c-edge: 79, 70, 229; --c-glow: 99, 102, 241;
    position: relative;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: .4em;
    min-height: 34px;
    padding: 0 12px 0 10px;
    border-radius: 999px;
    border: 1.5px solid var(--c-line);
    background: linear-gradient(180deg, var(--c-top), var(--c-bot));
    box-shadow: 0 2px 0 rgba(var(--c-edge), .32), 0 3px 5px -2px rgba(var(--c-edge), .32);   /* a bottom edge: it stands off the card */
    color: var(--c-ink);
    font: inherit;
    font-size: .8rem;
    font-weight: 800;
    line-height: 1.1;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chip[data-tool="swap"] { --c-ink: #115e59; --c-top: #f0fdfa; --c-bot: #ccfbf1; --c-line: #0f766e; --c-press: #99f6e4; --c-edge: 15, 118, 110; --c-glow: 20, 184, 166; }
  .chip .ico { flex: 0 0 auto; width: 1.1em; height: 1.1em; }   /* as tall as the label's line, so it grows with the text size and never makes the chip taller */
  .chip::after { content: ""; position: absolute; inset: -6px -4px; }
  /* The glow: both chips breathe, on every card, always, so the visitor sees at a glance that they can be tapped. The halo is the
     box-shadow of a pseudo element on the chip's border box (1 px in from the 1.5 px border, so no seam shows between them), drawn once
     and never changed; only its OPACITY moves, slowly and eased (a breath is 3 s: 0.33 Hz, far below the 3 flashes a second of WCAG 2.3.1),
     so it costs no paint, runs on the compositor and moves nothing: a shadow adds no box and no scroll area. It reaches 9.5 px beyond the
     chip (the body's padding is 12 px or more at the sides, so the card's overflow never clips it) and starts from its low end, both chips
     together, so they breathe in phase. */
  .chip::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
    box-shadow: 0 0 7px 1.5px rgba(var(--c-glow), .85);
    opacity: .3; transition: box-shadow .25s ease;
    animation: chip-glow 3s ease-in-out infinite;
  }
  @keyframes chip-glow {
    0%, 100% { opacity: .3; }
    50%      { opacity: .95; }
  }
  /* It holds still where it would be in the way: while the card is dragged, while the page is busy and while a sheet is open over it, it stops
     where it is and the halo fades to a faint one (a fade of the shadow's colour: stopping an opacity animation by removing it would snap),
     and on a chip that is not live (a swipe is on its way) it is gone. */
  #wrap.dragging .chip::before, #wrap.busy .chip::before { animation-play-state: paused; box-shadow: 0 0 7px 1.5px rgba(var(--c-glow), .25); }
  .chip[aria-disabled="true"]::before { animation: none; opacity: 0; }
  .chip:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  .chip:not([aria-disabled="true"]):active { transform: translateY(1px) scale(0.97); background: var(--c-press); box-shadow: 0 1px 0 rgba(var(--c-edge), .32); }
  .chip[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .head .chip, .foodhead .chip { margin-left: auto; }   /* right-aligned, also when it wraps onto a row of its own (320 px wide, large text) */
  /* A large text size: the name block has no room beside the badge, so the Ask AI chip takes that place and the name block gets the row
     under it (a visual order only: the chip is still the first stop of the keyboard, the name is no stop at all). */
  #wrap.big .head > div { order: 1; }
  .foodhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
  /* The footer: Back / Keep pill / Replace, pinned to the foot of the card under a hairline, so it never scrolls and never moves. Equal
     shares of the row; a label is never broken inside a word: a button that cannot hold its longest word wraps onto its own row (a large
     text size on a narrow phone), and from about 140 % text the decorative arrows go (the label says it). */
  #actions {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid rgba(15, 23, 42, 0.08);
    background: rgba(255, 255, 255, 0.72);
  }
  #actions button {
    flex: 1 1 0;
    min-width: min-content;
    overflow-wrap: break-word;
    min-height: 48px;
    border-radius: 12px;
    font: inherit;
    font-size: .95rem;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid;
    background: #fff;
    touch-action: manipulation;
  }
  #actions button:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  #actions #btnBack { flex: 0 0 52px; min-width: 52px; border-color: #e2e8f0; color: #334155; }
  #wrap.big .arr { display: none; }
  #actions #btnKeep { border-color: #fca5a5; color: #b91c1c; }
  #actions #btnRepl { border-color: #047857; color: #ffffff; background: #047857; }
  #actions button:not(:disabled):active { transform: scale(0.97); }
  #actions button:disabled, #actions button[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  /* Tight card: fitHeight() switches it on when the room above the page's fixed bottom bar is short (small phones, large text),
     so the card keeps as much of its text in view as it can. Same texts, same font sizes for the body copy; only the spacing, the
     badge, the name and the chips (30 px, the same tap area) shrink, and on a touch screen the swipe hint is dropped after the first
     card the visit has drawn (a mouse and keyboard user keeps it: it is the only place the arrow keys are named). The footer's
     buttons are 48 px on every card. */
  #wrap.tight .cbody { padding: 8px 12px 6px 12px; }
  #wrap.tight .head { margin-top: 6px; gap: 10px; }
  #wrap.tight .badge { flex-basis: 40px; height: 40px; font-size: 1.3rem; border-radius: 12px; }
  #wrap.tight .name { font-size: 1.4rem; }
  #wrap.tight .dose { margin-top: 2px; }
  #wrap.tight .foodwrap { margin-top: 6px; padding: 6px 10px; }
  #wrap.tight .foodrow { margin-top: 4px; }
  #wrap.tight .src { margin-top: 3px; }
  #wrap.tight .portion { margin-top: 6px; }
  #wrap.tight .pl { padding: 3px 8px 3px 8px; line-height: 1.3; }   /* two rows of 20 + 17 px: the panel is still 44 px high (the athlete one is a button) */
  #wrap.tight .pl-amt b { line-height: 1; }
  #wrap.tight .warn { margin-top: 6px; padding: 5px 8px; }
  #wrap.tight .bio { margin-top: 6px; padding: 5px 8px; }
  #wrap.tight .hint { padding-top: 6px; }
  #wrap.tight .chip { min-height: 30px; padding: 0 10px 0 8px; }   /* ~79 px wide with its icon: beside the name from a 340 px phone up (below it only when the name is longer); a 320 px phone has no icon, see below */
  #wrap.tight .chip::after { inset: -8px -4px; }
  #wrap.tight .foodhead .chip { margin-top: 0; }
  #wrap.tight:not(.first):not(.fine) .hint:not(.hint-keep) { display: none; }
  #wrap.tight #actions { padding: 6px 10px; }
  /* A card taller than its frame scrolls inside it: a fade (and, when a lot is hidden, a small pill) says there is more. Both are drawn
     over the foot of the scrolling window only (.cmain), above the footer and never over it, and they move with the card. */
  #stage.cue .cmain::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 4; pointer-events: none;
                             background: linear-gradient(to bottom, rgba(248,251,255,0), rgba(248,251,255,.96) 85%); }
  #cue { display: none; position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); z-index: 5; pointer-events: none; white-space: nowrap;
         font-size: .72rem; font-weight: 800; color: #334155; background: #fff; border: 1px solid rgba(15,23,42,.12); border-radius: 999px; padding: 1px 9px; }
  #stage.cue-strong #cue { display: block; }
  /* A 320 px phone (the card's own width is then 288 px; 308 px on a 340 px phone, which still has room): without the icon the chip is as narrow as it
     was, so the header chip stays beside the name on every card instead of taking a 40 px row of its own on some of them. The tint, the border, the
     edge, the bold label and the glow stay. */
  @media (max-width: 300px) {
    .chip .ico { display: none; }
    #wrap .chip { padding: 0 11px; }
    #wrap.tight .chip { padding: 0 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tcard, .rail { transition: none !important; }
    .chip::before { animation: none !important; transition: none; opacity: .55; }   /* nothing moves, but the halo stays, still and soft: the cue is not lost */
  }
  @media (forced-colors: active) { .chip::before { animation: none; } }   /* the browser drops the shadow there (the chips keep their borders): nothing to animate */
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="rail keep" id="railKeep" aria-hidden="true">KEEP</div>
    <div class="rail repl" id="railRepl" aria-hidden="true">REPLACE</div>
    <!-- Tab order (the DOM order, which is the visual one): the card, Ask AI (header), Swap food (Eat instead), the athlete-guide button,
         then Back, Keep pill, Replace in the footer. The body is rebuilt for every card; the footer is not. -->
    <div class="tcard" id="card" tabindex="0" role="group" aria-roledescription="swipe card">
      <div class="cmain">
        <div class="cbody" id="cbody"></div>
        <div id="cue" aria-hidden="true">&#9662; scroll for more</div>
      </div>
      <div id="actions">
        <button type="button" id="btnBack" aria-label="Back to the previous card" title="Back">&#8617;</button>
        <button type="button" id="btnKeep" aria-label="Keep pill"><span class="arr" aria-hidden="true">&#9664; </span>Keep pill</button>
        <button type="button" id="btnRepl" aria-label="Replace">Replace<span class="arr" aria-hidden="true"> &#9654;</span></button>
      </div>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
(function () {
  var stage = document.getElementById("stage");
  var card = document.getElementById("card");
  var railKeep = document.getElementById("railKeep");
  var railRepl = document.getElementById("railRepl");
  var btnBack = document.getElementById("btnBack");
  var btnKeep = document.getElementById("btnKeep");
  var btnRepl = document.getElementById("btnRepl");
  var cbody = document.getElementById("cbody");   // the card's scrolling body: rebuilt for every card, with the two chips (#btnAsk, #btnSwap) in it
  var actions = document.getElementById("actions");   // the pinned footer: Back / Keep pill / Replace (built once, never rebuilt)
  var live = document.getElementById("live");
  var lastFocusId = "";      // the action button the user used last: focus goes back to it when the next card is drawn
  var announce = "";         // "Kept the pill." - said together with the next card
  var HEIGHT = 420;   // minimum frame height (from Python)
  var lastHeight = 0;
  var tight = false;  // the compact card (see "#wrap.tight"); once on it stays on for the scan
  var showSrc = true; // the full USDA name in the food block: only while the card has room for it (see fitHeight)
  var spacer = false; // the blank strip under the buttons (see "#wrap.spacer")
  var big = false;    // a large text size (the root font size is 140 % or more): see "#wrap.big"
  var busy = false;   // the page is analysing a new label or has a sheet open over the card: the chips' glow holds still meanwhile (see "#wrap.busy")
  var drawnBefore = false;  // a card was drawn in this page load already (a resumed scan opens on a later card: its hint is still new)
  var firstCard = true;     // the card on screen is the first of the scan or the first this page load drew: it keeps the swipe hint
  var wrap = document.getElementById("wrap");
  var lastArgsKey = "";
  var maxHeight = 0;  // the tallest card of this scan so far: the frame only grows, so the buttons stay where the thumb is
  var committed = false;
  var canReplace = true;
  var canBack = false;
  // The iframe is reused for every card of a scan (stable Streamlit key), so
  // each swipe carries the card it was made on and a unique id; Python applies
  // it once and answers with the next card's props in the same script run.
  var cardId = "";
  var cardIndex = 0;

    var chips = cbody.querySelectorAll("[data-tool]");
    for (var i = 0; i < chips.length; i++) { chips[i].setAttribute("aria-disabled", "true"); }
    announce = dir === "right" ? "Replaced with the whole food. " : (dir === "left" ? "Kept the pill. " : "Going back. ");
    seq += 1;
    var value = stamp({ dir: dir, id: Date.now() + "-" + seq });
    if (dir === "back" || reduceMotion) {
      setValue(value);
      return;
    }
    var w = Math.max(window.innerWidth, 480);
    var off = dir === "right" ? w : -w;
    card.style.transition = "transform .3s ease";
    card.style.transform = "translate(" + off + "px, -30px) rotate(" + (dir === "right" ? 22 : -22) + "deg)";
    (dir === "right" ? railRepl : railKeep).style.opacity = 1;
    // Send right away: the server round trip overlaps the fly-out, and the next
    // card's props are held until the animation is done (see onRender).
    animEnd = Date.now() + 220;
    setValue(value);
  }

  function onRender(args) {
    var wait = animEnd - Date.now();
    if (wait <= 0) { pendingArgs = null; render(args); return; }
    var first = pendingArgs === null;
    pendingArgs = args;
    if (first) {
      setTimeout(function () { var a = pendingArgs; pendingArgs = null; render(a); }, wait);
    }
  }

  // Drag-to-swipe. Pointer Events cover mouse, pen and touch; the legacy touch
  // listeners are only used on browsers without Pointer Events, so a single
  // touch never triggers both paths.
  var dragging = false, sx = 0, sy = 0, dx = 0, dy = 0, horizontal = null, movedBeyondTap = false;
  var THRESH = 80;

  function down(x, y) {
    if (committed || hostBusy()) return;
    movedBeyondTap = false;
    dragging = true; horizontal = null;
    sx = x; sy = y; dx = 0; dy = 0;
    card.style.transition = "none";
    paint();   // the chips' glow holds still while the card is held
  }
  function move(x, y, ev) {
    if (!dragging) return;
    dx = x - sx; dy = y - sy;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) { movedBeyondTap = true; }
    if (horizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      horizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!horizontal) return; // vertical gesture: let the card content scroll
    card.style.transform = "translate(" + dx + "px," + (dy * 0.22) + "px) rotate(" + (dx / 18) + "deg)";
    rails(dx);
    if (ev && ev.cancelable) ev.preventDefault();
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    paint();   // ... and breathes again
    if (horizontal && dx > THRESH && canReplace) {
      commit("right");
    } else if (horizontal && dx < -THRESH) {
      commit("left");
    } else {
      card.style.transition = reduceMotion ? "none" : "transform .2s ease";
      card.style.transform = "";
      rails(0);
    }
  }

  // A press on a button of the card (Back / Keep pill / Replace, the two chips) is a tap and nothing else: it never starts a drag and the
  // pointer is not captured, so the button gets its own click (with the capture on the card the click would be the card's). The athlete-guide
  // button is the one button a drag may start on: its capture waits for the finger to move (see below).
  function onPlainButton(e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    return !!b && !b.hasAttribute("data-guide");
  }
  if (window.PointerEvent) {
    var downOnGuide = false;
    card.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      downOnGuide = !!(e.target.closest && e.target.closest("[data-guide]"));
      if (onPlainButton(e)) return;
      down(e.clientX, e.clientY);
      // On the guide link the capture waits until the finger really moves (see move()), so a tap still reaches the button.
      if (!downOnGuide) { try { card.setPointerCapture(e.pointerId); } catch (err) {} }
    });
    card.addEventListener("pointermove", function (e) {
      if (downOnGuide && dragging && !card.hasPointerCapture(e.pointerId) && (Math.abs(e.clientX - sx) > 6 || Math.abs(e.clientY - sy) > 6)) {
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
      }
      move(e.clientX, e.clientY, e);
    });
    card.addEventListener("pointerup", up);
    card.addEventListener("pointercancel", up);
  } else {
    card.addEventListener("touchstart", function (e) { if (onPlainButton(e)) return; var t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchmove", function (e) { var t = e.touches[0]; move(t.clientX, t.clientY, e); }, { passive: false });
    card.addEventListener("touchend", up);
    card.addEventListener("mousedown", function (e) { if (onPlainButton(e)) return; down(e.clientX, e.clientY); });
    window.addEventListener("mousemove", function (e) { move(e.clientX, e.clientY, e); });
    window.addEventListener("mouseup", up);
  }

  function guideEvent() {
    if (committed || hostBusy()) return;   // a swipe is already on its way / an analysis is running
    seq += 1;
    setValue(stamp({ kind: "guide", id: "g" + Date.now() + "-" + seq, nutrient: cardId }));
  }
  // The tools (Swap food / Ask AI): each posts one event that the page answers with a sheet. They never change the card or a
  // decision. A second tap within 0.7 s (a double tap) is dropped, and nothing is sent while a swipe is on its way.
  var toolUntil = 0;
  var returnTo = "";   // the id of the tool that opened a sheet: when the page hands the focus back to this frame it goes to that chip again
  function toolEvent(kind) {
    if (committed || hostBusy()) return;
    var now = Date.now();
    if (now < toolUntil) return;
    toolUntil = now + 700;
    seq += 1;
    returnTo = kind === "swap" ? "btnSwap" : "btnAsk";
    setValue(stamp({ kind: kind, id: kind + "-" + now + "-" + seq }));
  }
  // A sheet over the page makes the page behind it inert, so the button that had the focus loses it; the page returns the focus to this
  // frame when the sheet closes, and the keyboard or screen-reader user is put back on the button they used.
  window.addEventListener("focus", function () {
    if (!returnTo || (document.activeElement && document.activeElement !== document.body)) { return; }
    var button = document.getElementById(returnTo);   // by id: the body (and the chip in it) is rebuilt when the card changes
    returnTo = "";
    if (button) { focusChip(button); }
  });
  // The frame is announced by its title: the component's own name ("app.tinder_swipe") says nothing.
  try { window.frameElement.setAttribute("title", "Nutrient card: swipe, or use the buttons"); } catch (e) {}
  // One click listener for what the body rebuilds with every card: the two chips and the athlete-guide button.
  card.addEventListener("click", function (e) {
    var hit = e.target.closest ? e.target.closest("[data-tool], [data-guide]") : null;
    if (!hit) { return; }
    if (hit.hasAttribute("data-tool")) { toolEvent(hit.getAttribute("data-tool")); return; }
    if (e.detail > 0 && movedBeyondTap) { movedBeyondTap = false; return; }   // a pointer click after a drag was a swipe, not a tap (keyboard clicks have detail 0)
    guideEvent();
  });
  btnKeep.addEventListener("click", function () { commit("left"); });
  btnRepl.addEventListener("click", function () { commit("right"); });
  btnBack.addEventListener("click", function () { commit("back"); });
  // The card is the one tab stop of the text, and its scroller is the body inside it: with the focus on the card itself the keys that scroll
  // a page scroll the body (when it has anything to scroll; otherwise they go on to the page as before).
  card.addEventListener("keydown", function (e) {
    if (e.target !== card || e.altKey || e.ctrlKey || e.metaKey || cbody.scrollHeight <= cbody.clientHeight) { return; }
    var k = e.key, step = Math.max(40, cbody.clientHeight * 0.9);
    if (k === "ArrowDown") { cbody.scrollTop += 40; }
    else if (k === "ArrowUp") { cbody.scrollTop -= 40; }
    else if (k === "PageDown" || (k === " " && !e.shiftKey)) { cbody.scrollTop += step; }
    else if (k === "PageUp" || (k === " " && e.shiftKey)) { cbody.scrollTop -= step; }
    else if (k === "Home") { cbody.scrollTop = 0; }
    else if (k === "End") { cbody.scrollTop = cbody.scrollHeight; }
    else { return; }
    e.preventDefault();
  });
  // aria-disabled buttons are still clickable: the opacity says "not now", commit() ignores a second tap.
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { commit("left"); e.preventDefault(); }
    else if (e.key === "ArrowRight") { commit("right"); e.preventDefault(); }
    else if (e.key === "Backspace") { commit("back"); e.preventDefault(); }
  });

  window.addEventListener("message", function (event) {
    var d = event.data;
    if (event.source !== window.parent) return; // only our Streamlit host
    if (!d || d.type !== "streamlit:render") return;
    onRender(d.args);
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight(HEIGHT);
})();
</script>
</body>
</html>
