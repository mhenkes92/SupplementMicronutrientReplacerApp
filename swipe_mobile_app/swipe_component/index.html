<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100vh; }
  #stage {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    touch-action: pan-y;
  }
  .rail {
    position: absolute;
    top: 16px;
    z-index: 3;
    font-weight: 900;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    padding: 6px 12px;
    border-radius: 12px;
    border: 3px solid;
    opacity: 0;
    transition: opacity .12s ease;
    pointer-events: none;
  }
  .rail.keep  { left: 16px;  color: #b91c1c; border-color: #ef4444; transform: rotate(-12deg); }
  .rail.repl  { right: 16px; color: #047857; border-color: #10b981; transform: rotate(12deg); }
  .tcard {
    position: absolute;
    inset: 0;
    z-index: 2;
    border-radius: 18px;
    padding: 16px 16px 12px 16px;
    box-sizing: border-box;
    background: var(--card-bg, linear-gradient(160deg, #ffffff 0%, #f8fbff 55%, #f4f7fb 100%));
    border: none;
    box-shadow: none;
    cursor: grab;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    will-change: transform;
    outline: none;
    overflow-y: auto;
  }
  .tcard:focus-visible { box-shadow: 0 0 0 3px #2563eb inset; }
  .tcard::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: linear-gradient(135deg, var(--accent, #64748b) 0%, transparent 46%);
    opacity: 0.16;
    pointer-events: none;
  }
  .tcard:active { cursor: grabbing; }
  .row { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .count { font-size: .74rem; font-weight: 800; color: #475569; }
  .prev { font-size: .72rem; font-weight: 700; color: #334155; background: rgba(15,23,42,0.06); border-radius: 999px; padding: 2px 8px; }
  .name { position: relative; z-index: 2; font-size: 1.7rem; font-weight: 900; line-height: 1.05; color: var(--ink, #0f172a); margin-top: 8px; letter-spacing: -0.02em; }
  .dose { position: relative; z-index: 2; margin-top: 8px; color: #334155; font-size: 1rem; font-weight: 600; }
  .foodwrap { position: relative; z-index: 2; margin-top: auto; }
  .foodlbl { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #475569; }
  .food { margin-top: 4px; font-size: 1.02rem; font-weight: 800; color: #0f172a; line-height: 1.15; }
  .portion { position: relative; z-index: 2; margin-top: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.30); color: #234a32; font-size: .82rem; line-height: 1.5; }
  .portion .pl { display: block; }
  .portion b { color: #0f172a; }
  .warn { position: relative; z-index: 2; margin-top: 6px; padding: 5px 9px; border-radius: 8px; background: rgba(239,68,68,0.10); border: 1px solid rgba(239,68,68,0.30); color: #9b1c1c; font-size: .74rem; font-weight: 700; line-height: 1.3; }
  .bio { position: relative; z-index: 2; margin-top: 8px; padding: 6px 9px; border-radius: 10px; background: rgba(59,130,246,0.09); border: 1px solid rgba(59,130,246,0.22); color: #24425f; font-size: .74rem; line-height: 1.35; }
  .hint { position: relative; z-index: 2; text-align: center; margin-top: 10px; font-size: .74rem; color: #475569; }
  #actions { display: flex; gap: 8px; padding: 8px 2px 2px 2px; flex: 0 0 auto; }
  #actions button {
    flex: 1 1 0;
    min-height: 46px;
    border-radius: 12px;
    font: inherit;
    font-size: .95rem;
    font-weight: 800;
    cursor: pointer;
    border: 2px solid;
    background: #fff;
  }
  #actions button:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  #btnBack { flex: 0 0 52px; border-color: #cbd5e1; color: #334155; }
  #btnKeep { border-color: #ef4444; color: #b91c1c; }
  #btnRepl { border-color: #10b981; color: #047857; background: #ecfdf5; }
  #actions button:disabled { opacity: .45; cursor: not-allowed; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  @media (prefers-reduced-motion: reduce) {
    .tcard, .rail { transition: none !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="rail keep" id="railKeep" aria-hidden="true">KEEP</div>
    <div class="rail repl" id="railRepl" aria-hidden="true">REPLACE</div>
    <div class="tcard" id="card" tabindex="0" role="group" aria-roledescription="swipe card"></div>
  </div>
  <div id="actions">
    <button type="button" id="btnBack" aria-label="Back to the previous card" title="Back">&#8617;</button>
    <button type="button" id="btnKeep" aria-label="Keep the pill">&#9664; Keep pill</button>
    <button type="button" id="btnRepl" aria-label="Replace with the whole food">Replace &#9654;</button>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>
<script>
(function () {
  var card = document.getElementById("card");
  var railKeep = document.getElementById("railKeep");
  var railRepl = document.getElementById("railRepl");
  var btnBack = document.getElementById("btnBack");
  var btnKeep = document.getElementById("btnKeep");
  var btnRepl = document.getElementById("btnRepl");
  var live = document.getElementById("live");
  var HEIGHT = 450;
  var committed = false;
  var canReplace = true;
  var canBack = false;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function send(type, extra) {
    var msg = { isStreamlitMessage: true, type: type };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    window.parent.postMessage(msg, "*");
  }
  function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }
  function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(args) {
    args = args || {};
    committed = false;
    canReplace = (args.canReplace !== false);
    canBack = parseInt(args.index || 0, 10) > 0;
    HEIGHT = parseInt(args.height || 450, 10) || 450;
    card.style.setProperty("--accent", args.accent || "#64748b");
    card.style.setProperty("--ink", args.ink || "#0f172a");
    if (args.bg) { card.style.setProperty("--card-bg", args.bg); }

    var idx = parseInt(args.index || 0, 10) + 1;
    var total = parseInt(args.total || 1, 10);
    var foodTxt = args.food ? esc(args.food) : "Pick a food below";
    var portionRows = "";
    if (args.matchDose) {
      portionRows += '<span class="pl">💊 Match this dose &rarr; eat <b>' + esc(args.matchDose) + '</b></span>';
    }
    if (args.rdaAmount) {
      portionRows += '<span class="pl">🏃 Athlete daily target' +
        (args.rdaLabel ? ' (' + esc(args.rdaLabel) + ')' : '') +
        ' &rarr; eat <b>' + esc(args.rdaAmount) + '</b></span>';
    }
    var portionHtml = portionRows ? '<div class="portion">' + portionRows + '</div>' : '';
    var warnHtml = args.warn ? '<div class="warn" role="note">' + esc(args.warn) + '</div>' : '';
    var bioHtml = args.bioNote ? '<div class="bio">💡 ' + esc(args.bioNote) + '</div>' : '';
    var prevHtml = args.previous ? '<span class="prev">Your choice: ' + esc(args.previous) + '</span>' : '';
    card.innerHTML =
      '<div class="row"><span class="count">Card ' + idx + ' of ' + total + '</span>' + prevHtml + '</div>' +
      warnHtml +
      '<div class="name">' + esc(args.name || "Micronutrient") + '</div>' +
      '<div class="dose">Dose: <b>' + esc(args.dose || "n/a") + '</b></div>' +
      '<div class="foodwrap"><div class="foodlbl">Whole-food replacement</div><div class="food">' + foodTxt + '</div>' + portionHtml + bioHtml + '</div>' +
      '<div class="hint">' + (canReplace
        ? 'Swipe or tap: <b>◀ keep pill</b> · <b>replace ▶</b> (arrow keys work too)'
        : 'No whole-food match for this one — keep the pill or go back') + '</div>';
    card.setAttribute("aria-label",
      "Card " + idx + " of " + total + ": " + (args.name || "Micronutrient") + ", dose " + (args.dose || "not available") +
      (args.food ? ". Whole-food replacement: " + args.food : "") +
      (args.matchDose ? ". To match the dose eat " + args.matchDose : "") +
      (args.warn ? ". Warning: " + args.warn : ""));

    btnRepl.disabled = !canReplace;
    btnBack.disabled = !canBack;
    btnKeep.disabled = false;
    card.style.transition = "none";
    card.style.transform = "";
    railKeep.style.opacity = 0;
    railRepl.style.opacity = 0;
    setHeight(HEIGHT);
  }

  function rails(dx) {
    var t = Math.min(1, Math.abs(dx) / 90);
    railRepl.style.opacity = (dx > 8 && canReplace) ? t : 0;
    railKeep.style.opacity = dx < -8 ? t : 0;
  }

  function commit(dir) {
    if (committed) return;
    if (dir === "right" && !canReplace) return;
    if (dir === "back" && !canBack) return;
    committed = true;
    btnKeep.disabled = btnRepl.disabled = btnBack.disabled = true;
    live.textContent = dir === "right" ? "Replaced with the whole food" : (dir === "left" ? "Kept the pill" : "Going back");
    if (dir === "back" || reduceMotion) {
      setValue({ dir: dir, id: Date.now() });
      return;
    }
    var w = Math.max(window.innerWidth, 480);
    var off = dir === "right" ? w : -w;
    card.style.transition = "transform .3s ease";
    card.style.transform = "translate(" + off + "px, -30px) rotate(" + (dir === "right" ? 22 : -22) + "deg)";
    (dir === "right" ? railRepl : railKeep).style.opacity = 1;
    setTimeout(function () { setValue({ dir: dir, id: Date.now() }); }, 220);
  }

  // Drag-to-swipe. Pointer Events cover mouse, pen and touch; the legacy touch
  // listeners are only used on browsers without Pointer Events, so a single
  // touch never triggers both paths.
  var dragging = false, sx = 0, sy = 0, dx = 0, dy = 0, horizontal = null;
  var THRESH = 80;

  function down(x, y) {
    if (committed) return;
    dragging = true; horizontal = null;
    sx = x; sy = y; dx = 0; dy = 0;
    card.style.transition = "none";
  }
  function move(x, y, ev) {
    if (!dragging) return;
    dx = x - sx; dy = y - sy;
    if (horizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      horizontal = Math.abs(dx) > Math.abs(dy);
    }
    if (!horizontal) return; // vertical gesture: let the card content scroll
    card.style.transform = "translate(" + dx + "px," + (dy * 0.22) + "px) rotate(" + (dx / 18) + "deg)";
    rails(dx);
    if (ev && ev.cancelable) ev.preventDefault();
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    if (horizontal && dx > THRESH && canReplace) {
      commit("right");
    } else if (horizontal && dx < -THRESH) {
      commit("left");
    } else {
      card.style.transition = reduceMotion ? "none" : "transform .2s ease";
      card.style.transform = "";
      rails(0);
    }
  }

  if (window.PointerEvent) {
    card.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      down(e.clientX, e.clientY);
      try { card.setPointerCapture(e.pointerId); } catch (err) {}
    });
    card.addEventListener("pointermove", function (e) { move(e.clientX, e.clientY, e); });
    card.addEventListener("pointerup", up);
    card.addEventListener("pointercancel", up);
  } else {
    card.addEventListener("touchstart", function (e) { var t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchmove", function (e) { var t = e.touches[0]; move(t.clientX, t.clientY, e); }, { passive: false });
    card.addEventListener("touchend", up);
    card.addEventListener("mousedown", function (e) { down(e.clientX, e.clientY); });
    window.addEventListener("mousemove", function (e) { move(e.clientX, e.clientY, e); });
    window.addEventListener("mouseup", up);
  }

  btnKeep.addEventListener("click", function () { commit("left"); });
  btnRepl.addEventListener("click", function () { commit("right"); });
  btnBack.addEventListener("click", function () { commit("back"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { commit("left"); e.preventDefault(); }
    else if (e.key === "ArrowRight") { commit("right"); e.preventDefault(); }
    else if (e.key === "Backspace") { commit("back"); e.preventDefault(); }
  });

  window.addEventListener("message", function (event) {
    var d = event.data;
    if (event.source !== window.parent) return; // only our Streamlit host
    if (!d || d.type !== "streamlit:render") return;
    render(d.args);
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight(HEIGHT);
})();
</script>
</body>
</html>
