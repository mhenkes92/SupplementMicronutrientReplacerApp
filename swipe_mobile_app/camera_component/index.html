<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuppSwipe camera</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { width: 100%; }
  video, #preview {
    width: 100%;
    height: 300px;
    border-radius: 14px;
    background: #0f172a;
    display: block;
    object-fit: cover;
  }
  #preview { display: none; }
  .btnrow { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
  }
  .primary { background: #16a34a; color: #fff; }
  .ghost { background: #e2e8f0; color: #0f172a; }
  #err { color: #b91c1c; font-size: 0.85rem; margin-top: 8px; min-height: 1em; }
  .hint { color: #64748b; font-size: 0.8rem; margin-top: 6px; text-align: center; }
  #processing { display: none; text-align: center; padding: 18px 0 8px 0; }
  .cam-spinner {
    width: 42px; height: 42px; margin: 0 auto 10px auto;
    border-radius: 999px;
    border: 4px solid #d5deeb; border-top-color: #16a34a;
    animation: cam-spin 0.9s linear infinite;
  }
  .cam-proc-text { color: #0f766e; font-size: 0.95rem; font-weight: 800; }
  @keyframes cam-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <img id="preview" alt="captured" />
  <div class="btnrow" id="liveBtns">
    <button class="primary" id="snap">📸 Capture</button>
  </div>
  <div class="btnrow" id="previewBtns" style="display:none;">
    <button class="ghost" id="retake">↺ Retake</button>
    <button class="primary" id="use">✅ Use photo</button>
  </div>
  <div id="processing">
    <div class="cam-spinner"></div>
    <div class="cam-proc-text">Sending photo for analysis…</div>
  </div>
  <div class="hint">Uses your device's <b>back camera</b> when available.</div>
  <div id="err"></div>
</div>
<script>
(function () {
  var video = document.getElementById("video");
  var preview = document.getElementById("preview");
  var liveBtns = document.getElementById("liveBtns");
  var previewBtns = document.getElementById("previewBtns");
  var errEl = document.getElementById("err");
  var HEIGHT = 450;
  var stream = null;
  var lastDataUrl = "";
  var lastBarcode = "";
  // Native barcode reading (Chrome/Android, some desktop browsers). Where it is
  // missing the photo is still read by the vision model, so this is optional.
  var detector = null;
  try {
    if ("BarcodeDetector" in window) {
      detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
    }
  } catch (e) { detector = null; }

  function send(type, extra) {
    var msg = { isStreamlitMessage: true, type: type };
    if (extra) { for (var k in extra) { msg[k] = extra[k]; } }
    window.parent.postMessage(msg, "*");
  }
  function setHeight(h) { send("streamlit:setFrameHeight", { height: h }); }
  function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  async function startCamera() {
    errEl.textContent = "";
    errEl.style.color = "";
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play().catch(function () {});
    } catch (e) {
      var name = e && e.name ? e.name : "";
      var msg;
      if (name === "NotAllowedError" || name === "SecurityError") {
        msg = "Camera access is blocked. Allow the camera for this site in your browser settings, or use the File / Gallery tab.";
      } else if (name === "NotFoundError" || name === "OverconstrainedError") {
        msg = "No camera was found on this device. Use the File / Gallery tab instead.";
      } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        msg = "This browser can't open the camera here. Use the File / Gallery tab instead.";
      } else {
        msg = "The camera couldn't start (it may be in use by another app). Use the File / Gallery tab instead.";
      }
      errEl.textContent = msg;
      liveBtns.style.display = "none";
      video.style.display = "none";
    }
    setHeight(HEIGHT);
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }

  function showLive() {
    preview.style.display = "none";
    video.style.display = "block";
    liveBtns.style.display = "flex";
    previewBtns.style.display = "none";
  }
  function showPreview() {
    video.style.display = "none";
    preview.style.display = "block";
    liveBtns.style.display = "none";
    previewBtns.style.display = "flex";
  }

  document.getElementById("snap").addEventListener("click", function () {
    if (!video.videoWidth) { errEl.textContent = "Camera not ready yet."; return; }
    var vw = video.videoWidth, vh = video.videoHeight;
    var maxSide = 1280;
    var scale = Math.min(1, maxSide / Math.max(vw, vh));
    var canvas = document.createElement("canvas");
    canvas.width = Math.round(vw * scale);
    canvas.height = Math.round(vh * scale);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    lastDataUrl = canvas.toDataURL("image/jpeg", 0.72);
    preview.src = lastDataUrl;
    lastBarcode = "";
    errEl.textContent = "";
    showPreview();
    if (detector) {
      detector.detect(canvas).then(function (codes) {
        if (codes && codes.length && codes[0].rawValue) {
          lastBarcode = String(codes[0].rawValue);
          errEl.style.color = "#047857";
          errEl.textContent = "Barcode " + lastBarcode + " found — tap Use photo to look it up.";
        }
      }).catch(function () {});
    }
  });

  document.getElementById("retake").addEventListener("click", function () {
    lastDataUrl = "";
    showLive();
  });

  document.getElementById("use").addEventListener("click", function () {
    if (!lastDataUrl) { return; }
    // Instant feedback: swap to a processing state right away so the user never
    // sees a frozen dialog while the image is posted to Python and analyzed.
    video.style.display = "none";
    preview.style.display = "none";
    liveBtns.style.display = "none";
    previewBtns.style.display = "none";
    document.getElementById("processing").style.display = "block";
    stopCamera();
    // Defer the (large) value post one frame so the processing UI paints first.
    requestAnimationFrame(function () {
      setTimeout(function () { setValue({ image: lastDataUrl, barcode: lastBarcode, id: Date.now() }); }, 0);
    });
  });

  window.addEventListener("message", function (event) {
    var d = event.data;
    if (event.source !== window.parent) return; // only our Streamlit host
    if (!d || d.type !== "streamlit:render") return;
    setHeight(HEIGHT);
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight(HEIGHT);
  startCamera();
})();
</script>
</body>
</html>
