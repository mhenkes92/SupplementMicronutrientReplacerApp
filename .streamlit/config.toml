# Streamlit reads this file from the directory `streamlit run` is started in,
# which on Streamlit Community Cloud is the repository root (the old
# mobile_version/.streamlit/config.toml was never applied to the live app).

[server]
headless = true
# Label photos are well under 10 MB; this also stops oversized uploads before
# they reach the image decoder.
maxUploadSize = 10
# Component values (the camera's photo) travel over the websocket, which
# defaults to 200 MB per message; nothing the app sends or receives comes
# near 25 MB.
maxMessageSize = 25

[browser]
gatherUsageStats = false

[client]
# Show only the error type to visitors, never stack traces with file paths.
showErrorDetails = "type"
# Hide developer-only toolbar items (e.g. "Deploy") from visitors.
toolbarMode = "minimal"

[theme]
# The app's custom styling assumes light backgrounds; without a fixed base,
# phones in dark mode rendered near-white text on the light cards and pills.
base = "light"
# Accessible primary (white text on #047857 = 5.5:1, WCAG AA) that also keeps
# the main "Analyze" button distinct from the red "keep pill" action.
primaryColor = "#047857"
